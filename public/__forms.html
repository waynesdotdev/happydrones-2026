<!DOCTYPE html>
<!--
  DON'T DELETE THIS FILE.
  Netlify reads this hidden copy of the contact form when the site is
  deployed, so it knows to collect "quote" and "mission" form submissions.
  The real forms are in components/ContactSection.jsx (quote)
  and components/MissionPlanner.jsx (mission).
  If you add, remove or rename a field there, do the same here.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Forms</title><meta name="robots" content="noindex" /></head>
<body>
  <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote" />
    <input name="bot-field" />
    <input name="subject" />
    <input name="role" />
    <input name="name" />
    <input name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input name="postcode" />
    <input type="date" name="date" />
    <textarea name="message"></textarea>
    <input name="quote-summary" />
    <input name="quote-total" />
  </form>
  <form name="mission" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="mission" />
    <input name="bot-field" />
    <input name="subject" />
    <input name="code" />
    <textarea name="plan"></textarea>
    <input name="total" />
    <input name="mission" />
    <input name="scale" />
    <input name="freq" />
    <input name="extras" />
    <input name="postcode" />
    <input type="date" name="date" />
    <input name="name" />
    <input name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
