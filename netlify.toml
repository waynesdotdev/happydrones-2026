# Netlify reads this file automatically.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short ways in to the unlisted changelog
[[redirects]]
  from = "/change-log"
  to = "/changelog/"
  status = 301

[[redirects]]
  from = "/changes"
  to = "/changelog/"
  status = 301
