# Netlify reads this file automatically.
[build]
  command = "npm run build"
  publish = "out"
  # Skip the build (and save credits) when only notes files changed since the last deploy.
  # Exit code 0 = skip. Netlify only builds the "live" branch; see CLAUDE.md.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)TODO.md' ':(exclude)CLAUDE.md' ':(exclude)README.md' ':(exclude)README.txt' ':(exclude)**/README.txt'"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short ways in to the unlisted changelog
[[redirects]]
  from = "/change-log"
  to = "/changelog/"
  status = 301

[[redirects]]
  from = "/changes"
  to = "/changelog/"
  status = 301
